[project]
name = "agent-runtime"
version = "0.1.0"
description = "FrontDesk AI agent runtime: LangGraph flow, STT/LLM/TTS providers behind Protocols, guardrails, event bridge (EPIC-003, ADR-002)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "pydantic>=2.7",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "ASYNC",
]
ignore = [
    # Line length handled by the formatter.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_anthropic.*", "langchain_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
