# Provisionamento de dashboards: carrega os JSONs de
# /var/lib/grafana/dashboards (montar infra/observability/grafana/dashboards).

apiVersion: 1

providers:
  - name: frontdesk
    orgId: 1
    folder: FrontDesk AI
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
