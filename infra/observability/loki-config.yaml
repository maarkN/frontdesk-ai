# Loki single-binary para o ambiente local/observabilidade do FrontDesk AI.
# Armazenamento em filesystem; sem multi-tenancy de logs (auth_enabled: false
# — o tenant do PRODUTO viaja como label `tenant` vindo do slog handler).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h # 30 dias

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
