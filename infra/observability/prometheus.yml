# Prometheus do FrontDesk AI (EPIC-010): faz scrape do exporter Prometheus
# do OTel Collector — os serviços NÃO expõem /metrics próprios; tudo passa
# pelo collector via OTLP.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
