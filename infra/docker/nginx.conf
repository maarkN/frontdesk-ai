# FrontDesk AI — web dashboard. Serve o bundle Vite e faz proxy da API:
# o SPA fala com o core-api sob a MESMA origem em /v1 (ver apps/web/vite.config.ts).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy: "core-api" is the compose service name on the frontdesk network.
    location /v1 {
        proxy_pass http://core-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed static assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: TanStack Router owns client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
