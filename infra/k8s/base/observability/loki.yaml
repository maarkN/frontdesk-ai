# Loki — log store. Runs the image's bundled single-binary local config
# (filesystem storage, OTLP ingest enabled on 3100). Dev-grade; prod should
# move to object storage (S3, ca-central-1) via a custom config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: frontdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: frontdesk
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.1.1
          args: ["-config.file=/etc/loki/local-config.yaml"]
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: data
              mountPath: /loki
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
      volumes:
        - name: data
          emptyDir: {} # prod: PVC / S3 object storage
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: frontdesk
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
