# Prometheus — scrapes the OTel collector's Prometheus exporter and NATS.
# Storage is an emptyDir (dev-grade); prod should use a PVC or a managed
# offering (Amazon Managed Prometheus, ca-central-1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: frontdesk
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector.frontdesk.svc.cluster.local:8889"]
      - job_name: nats
        metrics_path: /metrics
        static_configs:
          - targets: ["nats.frontdesk.svc.cluster.local:8222"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: frontdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: frontdesk
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {} # prod: PVC or managed Prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: frontdesk
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
