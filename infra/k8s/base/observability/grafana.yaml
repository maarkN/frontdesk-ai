# Grafana — dashboards provisioned from ConfigMaps.
# Datasources: Prometheus (metrics), Loki (logs), Tempo (traces).
# Dashboard JSONs come from infra/observability/grafana/dashboards via the
# configMapGenerator in this directory's kustomization.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: frontdesk
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.frontdesk.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.frontdesk.svc.cluster.local:3100
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.frontdesk.svc.cluster.local:3200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: frontdesk
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: frontdesk
        folder: FrontDesk
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: frontdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: frontdesk
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - name: http
              containerPort: 3000
          env:
            # Dev-grade anonymous access; prod: SSO/OAuth + admin secret.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards # generated (see kustomization.yaml)
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: frontdesk
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
