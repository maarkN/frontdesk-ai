# core-api — Go REST API (dashboard backend, tenants, calls, billing).
# Stateless: safe to scale horizontally (HPA in overlays/prod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: frontdesk
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-api
        app.kubernetes.io/part-of: frontdesk
    spec:
      serviceAccountName: core-api
      containers:
        - name: core-api
          image: ghcr.io/maarkn/frontdesk/core-api:0.1.0 # placeholder tag
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: frontdesk-config
            - secretRef:
                name: frontdesk-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: frontdesk
spec:
  selector:
    app.kubernetes.io/name: core-api
  ports:
    - name: http
      port: 8080
      targetPort: http
