# Postgres — DEV/STAGING ONLY.
# In prod use Amazon RDS for PostgreSQL in ca-central-1 (data residency,
# PIPEDA/Loi 25): Multi-AZ, encrypted storage, automated backups, and RLS
# stays enforced at the database (`force row level security`). The prod
# overlay should point DATABASE_URL at RDS and scale this StatefulSet to 0
# (or drop it from the overlay).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: frontdesk
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: frontdesk
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: pg
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: frontdesk
spec:
  clusterIP: None # headless: stable DNS for the StatefulSet pod
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
