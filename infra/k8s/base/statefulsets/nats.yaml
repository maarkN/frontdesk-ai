# NATS with JetStream — the event bus (state = fold(events)).
# JetStream file store on a PVC so events survive pod restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: frontdesk
spec:
  serviceName: nats
  replicas: 1 # prod: 3-node JetStream cluster (add -cluster flags + routes)
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: frontdesk
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args:
            - "--jetstream"
            - "--store_dir=/data"
            - "--http_port=8222" # monitoring/health endpoint
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: jetstream
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: jetstream
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: frontdesk
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
