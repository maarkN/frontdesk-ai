# notifier — Go worker consuming NATS (owner SMS <60s, client SMS, weekly
# report e-mail). It has no serving Service; probes hit a small health
# listener the binary is expected to expose on :8081 (placeholder until
# NOTIFIER_HEALTH_ADDR lands in go/cmd/notifier).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/part-of: frontdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
        app.kubernetes.io/part-of: frontdesk
    spec:
      serviceAccountName: notifier
      containers:
        - name: notifier
          image: ghcr.io/maarkn/frontdesk/notifier:0.1.0 # placeholder tag
          ports:
            - name: health
              containerPort: 8081
          env:
            - name: NOTIFIER_HEALTH_ADDR
              value: ":8081"
          envFrom:
            - configMapRef:
                name: frontdesk-config
            - secretRef:
                name: frontdesk-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
