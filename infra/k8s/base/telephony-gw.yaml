# telephony-gw — Go media/call-control gateway. Calls are STATEFUL:
# a pod restart mid-call drops live audio. Shutdown therefore drains:
#   1. SIGTERM -> readiness flips to not-ready (endpoint removed, no new calls);
#   2. active calls run to completion up to DRAIN_TIMEOUT;
#   3. terminationGracePeriodSeconds must exceed DRAIN_TIMEOUT.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telephony-gw
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: telephony-gw
    app.kubernetes.io/part-of: frontdesk
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0   # never take capacity down while calls drain
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telephony-gw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telephony-gw
        app.kubernetes.io/part-of: frontdesk
    spec:
      serviceAccountName: telephony-gw
      # Drain budget: DRAIN_TIMEOUT (25m, from frontdesk-config) + margin.
      terminationGracePeriodSeconds: 1800
      containers:
        - name: telephony-gw
          image: ghcr.io/maarkn/frontdesk/telephony-gw:0.1.0 # placeholder tag
          ports:
            - name: http
              containerPort: 8080
            - name: media-udp
              containerPort: 4000 # External Media RTP (MEDIA_BACKEND=asterisk)
              protocol: UDP
          envFrom:
            - configMapRef:
                name: frontdesk-config
            - secretRef:
                name: frontdesk-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # /readyz must report 503 once SIGTERM/drain starts so the Service
          # stops routing NEW calls while active ones finish (main.go drain).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              # Small pause so kube-proxy/ingress remove the endpoint before
              # SIGTERM starts the in-process call drain.
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: telephony-gw
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: telephony-gw
    app.kubernetes.io/part-of: frontdesk
spec:
  selector:
    app.kubernetes.io/name: telephony-gw
  ports:
    - name: http
      port: 8080
      targetPort: http
    # External Media RTP (asterisk backend). ASTERISK_EXTERNAL_MEDIA_ADDR in
    # frontdesk-config points here. NOTE: with >1 replica, per-call RTP must
    # pin to the pod that owns the call — prod runs Asterisk close to the
    # gateway (same node / outside the cluster) instead of via this Service.
    - name: media-udp
      port: 4000
      targetPort: media-udp
      protocol: UDP
