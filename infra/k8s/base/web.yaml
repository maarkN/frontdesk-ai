# web — dashboard SPA (React/Vite build served by nginx).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: frontdesk
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: frontdesk
    spec:
      serviceAccountName: web
      containers:
        - name: web
          image: ghcr.io/maarkn/frontdesk/web:0.1.0 # placeholder tag (nginx + dist)
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: frontdesk
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
