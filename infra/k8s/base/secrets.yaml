# SECRET TEMPLATES — intentionally empty. Never commit real values.
# How to fill: see SECRETS.md in this directory.
# In prod, prefer ExternalSecrets/SealedSecrets backed by AWS Secrets Manager
# (ca-central-1) instead of applying this file directly.
apiVersion: v1
kind: Secret
metadata:
  name: frontdesk-secrets
  namespace: frontdesk
  labels:
    app.kubernetes.io/part-of: frontdesk
type: Opaque
stringData:
  TELNYX_API_KEY: ""        # carrier API (call control + SMS)
  TELNYX_FROM: ""           # SMS sender number (E.164)
  DEEPGRAM_API_KEY: ""      # STT streaming
  ANTHROPIC_API_KEY: ""     # LLM cascade (Haiku/Sonnet)
  CARTESIA_API_KEY: ""      # TTS primary
  ELEVENLABS_API_KEY: ""    # TTS fallback
  DATABASE_URL: ""          # postgres://... (RLS enforced per tenant)
  ARI_PASSWORD: ""          # Asterisk ARI user (MEDIA_BACKEND=asterisk only)
  AWS_ACCESS_KEY_ID: ""     # SES/S3 — prefer IRSA in prod, leave empty there
  AWS_SECRET_ACCESS_KEY: ""
  STRIPE_SECRET_KEY: ""     # billing
  STRIPE_WEBHOOK_SECRET: ""
---
# Only used by the in-cluster Postgres StatefulSet (dev/staging).
# Prod uses RDS — see base/statefulsets/postgres.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: frontdesk
  labels:
    app.kubernetes.io/part-of: frontdesk
type: Opaque
stringData:
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: ""
