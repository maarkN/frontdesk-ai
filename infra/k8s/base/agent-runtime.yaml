# agent-runtime — Python (LangGraph) agent. Serves the per-call websocket
# bridge consumed by telephony-gw. Turn sessions are in-flight state, so it
# also gets a moderate drain window (shorter than telephony-gw: a turn is
# seconds, a call is minutes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: frontdesk
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/part-of: frontdesk
    spec:
      serviceAccountName: agent-runtime
      terminationGracePeriodSeconds: 120
      containers:
        - name: agent-runtime
          image: ghcr.io/maarkn/frontdesk/agent-runtime:0.1.0 # placeholder tag
          ports:
            - name: ws
              containerPort: 8090
          env:
            - name: AGENT_RUNTIME_ADDR
              value: ":8090"
          envFrom:
            - configMapRef:
                name: frontdesk-config
            - secretRef:
                name: frontdesk-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # TCP probes until the bridge exposes an HTTP /healthz
          # (bridge.py serve_forever is still a sketch).
          livenessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: frontdesk
spec:
  selector:
    app.kubernetes.io/name: agent-runtime
  ports:
    - name: ws
      port: 8090
      targetPort: ws
