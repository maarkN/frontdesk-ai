; sorcery.conf — objetos PJSIP vêm do realtime (Postgres), não do pjsip.conf.
;
; SEM camada de cache de propósito: no lab, INSERT/UPDATE nas tabelas ps_*
; vale na próxima chamada/registro sem reload (objetivo do realtime aqui).
; Se o volume de chamadas um dia justificar, adicionar
; "endpoint/cache=memory_cache,..." na frente do backend realtime.
;
; Transports ficam FORA do realtime (continuam no pjsip.conf): o suporte de
; sorcery para transport dinâmico é limitado e um transport não muda em runtime.

[res_pjsip]
endpoint = realtime,ps_endpoints
auth = realtime,ps_auths
aor = realtime,ps_aors
; Contatos de REGISTER persistem no banco (sobrevivem a restart do container,
; e ficam visíveis: select * from ps_contacts).
contact = realtime,ps_contacts

[res_pjsip_endpoint_identifier_ip]
identify = realtime,ps_endpoint_id_ips

[res_pjsip_outbound_registration]
; Único tipo que NÃO é lido on-demand: carregado no boot/`pjsip reload`.
registration = realtime,ps_registrations
