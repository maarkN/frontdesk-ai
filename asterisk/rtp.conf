; rtp.conf — FrontDesk AI, backend Asterisk (ADR-009).

[general]
; Range de portas RTP (mídia SIP + canais External Media). Mantido curto de
; propósito para o lab: 100 portas ≈ 50 chamadas simultâneas (RTP+RTCP).
; Precisa casar com o EXPOSE do Dockerfile e com o firewall do host.
rtpstart = 10000
rtpend = 10200

; Sem ICE/STUN no lab (rede local); habilitar se o gateway ficar atrás de NAT.
icesupport = no
