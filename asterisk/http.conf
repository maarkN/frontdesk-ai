; http.conf — FrontDesk AI, backend Asterisk (ADR-009).
;
; O mini servidor HTTP do Asterisk carrega DUAS coisas:
;   1. ARI: REST em /ari/* e o WebSocket de eventos em /ari/events
;      (é aqui que o telephony-gw conecta via CyCoreSystems/ari).
;   2. O transporte wss do PJSIP (SIP over WebSocket) — ver pjsip.conf.

[general]
enabled = yes
; Em lab o bind é aberto; em qualquer ambiente compartilhado, restringir à
; rede interna (o ARI dá call control total a quem autenticar).
bindaddr = 0.0.0.0
bindport = 8088

; WebSocket habilitado (default yes quando enabled; explícito por clareza).
websocket_enabled = yes

; TLS para wss/ARI direto no Asterisk (alternativa: proxy reverso na frente).
; tlsenable = yes
; tlsbindaddr = 0.0.0.0:8089
; tlscertfile = /etc/asterisk/keys/asterisk.pem
