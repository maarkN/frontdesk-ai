; ari.conf — FrontDesk AI, backend Asterisk (ADR-009).
;
; O usuário ARI (e sua senha) NÃO vive neste arquivo versionado: o
; docker-entrypoint.sh gera /etc/asterisk/ari_secret.conf a partir das env
; vars ARI_USERNAME/ARI_PASSWORD no boot do container (configs do Asterisk
; não expandem variáveis de ambiente). O include abaixo materializa o user.

[general]
enabled = yes
; O transporte HTTP/WebSocket do ARI é o servidor de http.conf (porta 8088).
pretty = no
; websocket_write_timeout: cliente ARI lento não pode segurar o Asterisk.
websocket_write_timeout = 100

#include "ari_secret.conf"
