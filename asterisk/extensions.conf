; extensions.conf — FrontDesk AI, backend Asterisk (ADR-009).
;
; O dialplan é deliberadamente MÍNIMO: toda a lógica de chamada vive no
; telephony-gw via ARI/Stasis. Aqui só existem (1) a porta de entrada que
; entrega o canal ao app Stasis ativo e (2) o contexto de saída usado pelo
; failover para o celular do dono (transfer.initiated → Dial).

[globals]
; Blue/green por nome de app Stasis (nota 07 / ADR-009): o deploy novo sobe
; como "frontdesk-v2", aponta esta global (CLI: `dialplan set global
; ACTIVE_APP frontdesk-v2` ou via ARI /asterisk/variable) e a versão antiga
; drena naturalmente — readiness not-ready, processo vivo até esvaziar,
; teto maxDrainSec (ver go/internal/asterisk/drain.go).
ACTIVE_APP=frontdesk-v1
; Celular do dono para o failover de produto (G5: agente falhou → chamada cai
; no celular do dono, nunca em silêncio). Em produção vem da config do tenant;
; em lab, fixo aqui.
OWNER_CELL=+15145550100

; =========================================================================
; Entrada — trunk ITSP e softphone de teste caem no MESMO funil: Stasis.
; =========================================================================

[from-trunk]
; O canal entra no app Stasis ativo; o telephony-gw (cliente ARI) assume o
; call control: Answer, consent gate, External Media, agente.
exten => _X.,1,NoOp(FrontDesk inbound ${EXTEN} from ${CALLERID(num)})
 same => n,Stasis(${GLOBAL(ACTIVE_APP)})
 ; Se o Stasis retornar (app caiu ou fez continue sem tratar), NUNCA deixar o
 ; cliente em silêncio: failover direto para o celular do dono.
 same => n,Goto(transfer-owner,s,1)

[from-test]
; Softphone de lab: mesma jornada do trunk.
exten => _X.,1,Goto(from-trunk,${EXTEN},1)
exten => s,1,Goto(from-trunk,s,1)

; =========================================================================
; Saída — transferência a quente para o celular do dono.
; O telephony-gw executa Transfer(channelID, to) redirecionando o canal para
; cá (ARI continue → contexto transfer-owner, exten = número destino).
; =========================================================================

[transfer-owner]
; exten = E.164 do destino (vindo do CallControl.Transfer); "s" usa o default.
exten => _+X.,1,NoOp(FrontDesk transfer ${CHANNEL} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@trunk-primary,30)
 same => n,Hangup()
exten => s,1,Dial(PJSIP/${GLOBAL(OWNER_CELL)}@trunk-primary,30)
 same => n,Hangup()
