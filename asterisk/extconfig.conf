; extconfig.conf — mapeia famílias realtime → driver pgsql (ARA).
;
; Cada linha: familia => driver,banco,tabela. A conexão em si (host/senha)
; vem de res_pgsql.conf, GERADO pelo docker-entrypoint.sh a partir das env
; PGSQL_* — este arquivo é estático e não contém segredo.
; Esquema das tabelas: go/internal/store/migrations/0002_asterisk_realtime.sql.

[settings]
ps_endpoints => pgsql,frontdesk,ps_endpoints
ps_auths => pgsql,frontdesk,ps_auths
ps_aors => pgsql,frontdesk,ps_aors
ps_contacts => pgsql,frontdesk,ps_contacts
ps_endpoint_id_ips => pgsql,frontdesk,ps_endpoint_id_ips
ps_registrations => pgsql,frontdesk,ps_registrations
