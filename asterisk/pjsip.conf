; pjsip.conf — FrontDesk AI, backend Asterisk (ADR-009).
;
; chan_pjsip APENAS. O chan_sip foi removido do Asterisk a partir da versão 21
; (deprecado desde a 17) — qualquer documentação/exemplo baseado em sip.conf
; está morto e não deve ser portado para cá.
;
; A partir do realtime (ARA): este arquivo contém SÓ transports. Endpoints,
; auths, aors, identifies e registrations (troncos e ramais) vivem no
; PostgreSQL — tabelas ps_* (migration 0002_asterisk_realtime.sql), mapeadas
; em sorcery.conf + extconfig.conf. Para adicionar um tronco ou ramal:
; INSERT no banco (exemplos no README.md), sem tocar aqui e sem rebuild.

; =========================================================================
; Transportes (estáticos de propósito — não mudam em runtime; ver sorcery.conf)
; =========================================================================

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Em lab atrás de NAT, descomente e ajuste:
; external_media_address = 203.0.113.10
; external_signaling_address = 203.0.113.10
; local_net = 10.0.0.0/8

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; Exemplo de transporte WSS (SIP over WebSocket, ex.: softphone de browser no
; dashboard). O TLS do WebSocket é terminado pelo servidor HTTP do Asterisk —
; ver http.conf (tlsenable) — ou por um proxy reverso na frente.
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0
