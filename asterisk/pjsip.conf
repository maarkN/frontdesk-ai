; pjsip.conf — FrontDesk AI, backend Asterisk (ADR-009).
;
; chan_pjsip APENAS. O chan_sip foi removido do Asterisk a partir da versão 21
; (deprecado desde a 17) — qualquer documentação/exemplo baseado em sip.conf
; está morto e não deve ser portado para cá. Todo peer/trunk/transport vive
; neste arquivo, no modelo de objetos do PJSIP (transport/endpoint/aor/auth).

; =========================================================================
; Transportes
; =========================================================================

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Em lab atrás de NAT, descomente e ajuste:
; external_media_address = 203.0.113.10
; external_signaling_address = 203.0.113.10
; local_net = 10.0.0.0/8

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; Exemplo de transporte WSS (SIP over WebSocket, ex.: softphone de browser no
; dashboard). O TLS do WebSocket é terminado pelo servidor HTTP do Asterisk —
; ver http.conf (tlsenable) — ou por um proxy reverso na frente.
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0

; =========================================================================
; Trunk ITSP (template) — a perna PSTN continua sendo do carrier (ADR-004/009:
; CRTC, E911, STIR/SHAKEN são problema do carrier). Este trunk conecta o lab
; ao ITSP (ex.: Telnyx SIP trunking) para chamadas reais de teste.
; =========================================================================

[itsp-endpoint](!)
type = endpoint
transport = transport-udp
context = from-trunk               ; entrada cai no dialplan → Stasis
disallow = all
allow = ulaw                       ; G.711 na perna PSTN
allow = slin16                     ; slin16 interno (External Media sem transcode)
direct_media = no                  ; RTP sempre passa pelo Asterisk (External Media)
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733                ; DTMF fora de banda: sobrevive ao pipeline de áudio
language = en

[itsp-auth](!)
type = auth
auth_type = userpass

[itsp-aor](!)
type = aor
qualify_frequency = 30

; --- Instância concreta do trunk (preencher credenciais do ITSP) ---
[trunk-primary](itsp-endpoint)
outbound_auth = trunk-primary-auth
aors = trunk-primary

[trunk-primary-auth](itsp-auth)
username = CHANGE_ME
password = CHANGE_ME

[trunk-primary](itsp-aor)
contact = sip:sip.example-itsp.ca:5060

[trunk-primary-identify]
type = identify
endpoint = trunk-primary
match = sip.example-itsp.ca

; =========================================================================
; Endpoint de teste (softphone de lab) — registra em 6001 e disca para o
; agente sem passar pelo ITSP. Senha fraca de propósito: rede de lab isolada.
; =========================================================================

[test-6001]
type = endpoint
transport = transport-udp
context = from-test
disallow = all
allow = slin16
allow = ulaw
auth = test-6001-auth
aors = test-6001
dtmf_mode = rfc4733
direct_media = no

[test-6001-auth]
type = auth
auth_type = userpass
username = 6001
password = lab-only-6001

[test-6001-aor]
type = aor
max_contacts = 1
remove_existing = yes
